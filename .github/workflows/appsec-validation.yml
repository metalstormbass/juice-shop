name: AppSec remediation validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/package-lock.json'
  workflow_dispatch:
    inputs:
      pull_number:
        description: Same-repository AppSec remediation PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'appsec/'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./appsec
      - name: Verify OSV resolution and run isolated checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          unset GH_TOKEN
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          python -m appsec.pr_check --pr "$RUNNER_TEMP/pr.json" --config appsec/example.toml | tee "$RUNNER_TEMP/validation.json"
      - name: Summarize verification
        if: always()
        run: python -m appsec.github_report validation "$RUNNER_TEMP/validation.json"
