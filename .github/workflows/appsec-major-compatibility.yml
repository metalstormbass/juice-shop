name: AppSec major upgrade compatibility
on:
  push:
    branches: [feature/appsec-major-compatibility]
    paths: ['.github/workflows/appsec-major-compatibility.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: moment
            target: '2.19.3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install ./appsec
      - name: Assess and test the upgrade
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          appsec scan --ref HEAD > scan.json
          finding="$(jq -er --arg name "$PACKAGE" --arg version "$TARGET" '[.findings[] | select(.package == $name and (.fix_versions | index($version)))][0].finding_id' scan.json)"
          appsec remediate --ref HEAD --dry-run --config appsec/example.toml --finding-id "$finding" > summary.json
          python -m appsec.github_report remediation summary.json --finding-id "$finding"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ strategy.job-index }}
          path: |
            scan.json
            summary.json
            appsec.sqlite
