name: AppSec manual remediation

on:
  workflow_dispatch:
    inputs:
      finding_id:
        description: Stable finding ID from the AppSec issue or scan artifact
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: appsec-writes
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  remediate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: appsec-remediation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./appsec
      - name: Validate and propose dependency upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINDING_ID: ${{ inputs.finding_id }}
        run: |
          [[ "$FINDING_ID" =~ ^[a-f0-9]{32}$ ]]
          appsec remediate --config appsec/example.toml --ref HEAD --apply --finding-id "$FINDING_ID" | tee summary.json
          python -m appsec.github_report remediation summary.json --finding-id "$FINDING_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appsec-remediation
          path: |
            appsec.sqlite
            summary.json
