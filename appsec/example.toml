# Change this to the GitHub repository that owns the findings and draft PRs.
repository = "local/repository"
lockfile = "package-lock.json"
model = "gpt-4.1-mini"
agent_calls = 60
remediation_attempts = 3
input_cost_per_million = 0.4
output_cost_per_million = 1.6
run_npm_tests = true
# sqlite3 needs its native binary, which --ignore-scripts skips during npm ci.
rebuild_packages = ["sqlite3"]
# Build both application components and run the server suite offline.
prepare_frontend = true
test_commands = [["run", "build"], ["run", "test:server"]]
require_advisory_test = true

[security_behavior_tests]
# Verify signed-token expiry through the express-jwt dependency chain.
moment = [["exec", "--", "node", "--import", "tsx", "--test", "test/server/jwtExpiry.unit.test.ts"]]

[advisory_behavior_tests]
CVE-2023-46233 = [["exec", "--", "node", "--test", "appsec/checks/crypto-js-pbkdf2.cjs"]]
