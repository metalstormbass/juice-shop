[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "juice-shop-appsec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
appsec = "appsec.cli:main"

[tool.setuptools]
packages = ["appsec"]
package-dir = {appsec = "."}
